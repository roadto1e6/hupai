<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>唬牌</title><link rel="stylesheet" href="style.css"></head><body><main><header><img src="logo.png" alt=""><h1>唬牌</h1></header><section class="panel" aria-label="联机控制"><div class="status-row"><span id="dot" class="dot loading"></span><span id="phase">正在启动</span></div><h2 id="heading">正在启动</h2><p id="description" aria-live="polite"></p><div class="linkbox"><label for="address">邀请链接</label><input id="address" readonly placeholder="等待连接"></div><button id="enter" class="primary" disabled>进入游戏</button><button id="copy" class="secondary" disabled>复制链接</button><div class="minor"><button id="local" disabled>本机进入</button><button id="retry" hidden>重新连接</button><button id="stop" disabled>停止服务</button></div><p id="notice" aria-live="polite"></p></section></main><dialog id="confirm"><h2 id="confirmTitle">停止服务？</h2><p>当前联机将断开。</p><div><button id="cancel" class="secondary">取消</button><button id="confirmAction" class="primary">确认</button></div></dialog><script src="app.js"></script></body></html>
